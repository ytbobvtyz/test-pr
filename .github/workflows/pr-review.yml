name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get PR diff
        id: diff
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER.diff" > pr.diff
      
      - name: Get changed files
        id: files
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --name-only origin/${{ github.base_ref }}..HEAD > changed_files.txt
          echo "count=$(cat changed_files.txt | wc -l)" >> $GITHUB_OUTPUT
      
      - name: Send to AI Review Service
        id: ai_review
        env:
          REVIEW_SERVICE_URL: ${{ secrets.REVIEW_SERVICE_URL }}
        run: |
          DIFF_CONTENT=$(cat pr.diff | jq -Rs .)
          FILES_JSON=$(cat changed_files.txt | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length>0))')
          
          JSON_PAYLOAD=$(jq -n \
            --arg diff "$DIFF_CONTENT" \
            --argjson files "$FILES_JSON" \
            --arg title "${{ github.event.pull_request.title }}" \
            '{diff: $diff, files: $files, pr_title: $title}')
          
          RESPONSE=$(curl -s -X POST "$REVIEW_SERVICE_URL/api/review" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")
          
          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.review // "Ошибка: ревью не получено"')
    
          echo "review<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Post comment to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const review = `${{ steps.ai_review.outputs.review }}`;
      
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 AI Code Review\n\n${review}\n\n---\n*Автоматическое ревью*`
            });
